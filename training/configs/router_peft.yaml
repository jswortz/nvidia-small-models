# Phase 6 router LoRA. Copied from NeMo AutoModel's
# examples/llm_finetune/nemotron/nemotron_nano_9b_squad_peft.yaml; changes are marked "router:".
#
# Run on one GPU from the repo root (after python training/build_sft_data.py):
#   automodel training/configs/router_peft.yaml --nproc-per-node 1
# Rerunning the same command resumes from the latest checkpoint in checkpoint_dir.

recipe: TrainFinetuneRecipeForNextTokenPrediction

step_scheduler:
  global_batch_size: 16   # router: 676 examples; 8 per pass, 2 passes accumulated on 1 GPU
  local_batch_size: 8
  ckpt_every_steps: 40     # router: frequent checkpoints so an interrupted run resumes
  val_every_steps: 20
  max_steps: 160           # router: about 3.8 epochs

dist_env:
  backend: nccl
  timeout_minutes: 20

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1111
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: nvidia/NVIDIA-Nemotron-Nano-9B-v2
  trust_remote_code: true
  force_hf: true

# torch.compile configuration
compile:
  enabled: false
  mode: "default"  # Options: "default", "reduce-overhead", "max-autotune"
  fullgraph: false
  dynamic: true  # Set to false for better performance with fixed shapes
  backend: null  # Use default backend (inductor)

checkpoint:
  enabled: true
  checkpoint_dir: checkpoints/router-sft-train/   # router: training snapshots; merged model goes to checkpoints/router-sft/
  model_save_format: safetensors
  save_consolidated: true

peft:
  _target_: nemo_automodel.components._peft.lora.PeftConfig
  exclude_modules: ["*.out_proj"]  # mamba layers use custom kernels that take in the out_proj.weight directly, thus lora doesn't work here.
  dim: 16      # router: rank 16
  alpha: 32
  use_triton: True

distributed:
  strategy: fsdp2
  dp_size: none
  tp_size: 1
  cp_size: 1

  sequence_parallel: false

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

dataset:   # router: our chat examples; loss only on the assistant turn (the route JSON)
  _target_: nemo_automodel.components.datasets.llm.chat_dataset.ChatDataset
  path_or_dataset_id: training/output/sft/train.jsonl
  seq_length: 512
  truncation: true
  mask_generation_prompt: true

packed_sequence:
  packed_sequence_size: 0

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.default_collater
  shuffle: True

validation_dataset:   # router: dev split
  _target_: nemo_automodel.components.datasets.llm.chat_dataset.ChatDataset
  path_or_dataset_id: training/output/sft/val.jsonl
  seq_length: 512
  truncation: true
  mask_generation_prompt: true

validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.default_collater

optimizer:
  _target_: torch.optim.Adam
  betas: [0.9, 0.999]
  eps: 1e-8
  lr: 1.0e-4   # router: LoRA on a small dataset needs a higher rate than the recipe's 1e-5
  weight_decay: 0

lr_scheduler:
  lr_decay_style: cosine
  min_lr: 1.0e-6

